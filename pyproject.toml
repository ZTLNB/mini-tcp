[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minitcp"
version = "0.1.0"
description = "A TCP/IP stack written from scratch in pure Python: Ethernet, ARP, IPv4, ICMP, UDP and TCP with zero dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "tcp",
    "ip",
    "networking",
    "protocol",
    "stack",
    "education",
    "from-scratch",
    "ethernet",
    "arp",
    "ipv4",
    "udp",
    "icmp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
# Deliberately empty.  The whole point of this project is that it needs
# nothing, so there is nothing to install and nothing to pin.
dependencies = []

[project.optional-dependencies]
dev = []

[project.urls]
Homepage = "https://github.com/ZTLNB/mini-tcp"
Repository = "https://github.com/ZTLNB/mini-tcp"
Issues = "https://github.com/ZTLNB/mini-tcp/issues"

[tool.setuptools]
packages = [
    "minitcp",
    "minitcp.util",
    "minitcp.link",
    "minitcp.net",
    "minitcp.net.tcp",
]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
# The rule set is the measured-green subset, not the wish list.
#
# The previous declaration selected ten groups and reported 249 errors, which
# makes `ruff check` useless as a gate: nobody can run it locally and get a
# pass, so in practice it stops being run.  A lint config has to be green from
# day one to be worth anything -- same reasoning as mini-lsm's.
#
# The deferred groups are listed below with their counts at the time of
# writing, so the backlog is visible rather than implied.
select = [
    "E4",   # pycodestyle: import-related
    "E7",   # pycodestyle: statements (== None, ambiguous names)
    "E9",   # pycodestyle: runtime errors (syntax errors, ...)
    "F",    # pyflakes: undefined names, unused imports, redefinitions
    "I",    # isort: import ordering
    "W",    # pycodestyle: whitespace -- currently zero hits
    "C4",   # flake8-comprehensions -- currently zero hits
    "N",    # pep8-naming
    "B",    # flake8-bugbear: patterns that are usually real bugs
]
#
# Deferred, with the measured hit count:
#   UP  -- 170 hits, 140 of them UP031 (printf-style `%` formatting).  That is
#          a mechanical rewrite of every format string in the project; it
#          deserves its own commit rather than being smuggled into a CI patch.
#   RUF --  60 hits, mostly RUF022 (`__all__` not sorted) and RUF100.
#   SIM --   5 hits, readability suggestions rather than defects.
#   E5  --  36 hits, all E501.  Long explanatory comments and docstrings are
#          the point of this project, so line length stays unenforced.
ignore = [
    # Long explanatory comments and docstrings are the point of this project.
    # Kept here (rather than relying on E5 not being selected) so that turning
    # E5 on later does not silently reintroduce 36 failures.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
# The lowercase class name *is* the feature: this module exists so that
# `socket.socket(...)` reads like the standard library.  See its docstring.
"minitcp/socket.py" = ["N801"]
